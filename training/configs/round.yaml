# 한 회차 설정 예시. 회차마다 이 파일을 복사해 round 와 drives 만 바꿔 씁니다.
# 적지 않은 항목은 training/common.py 의 DEFAULTS 값을 씁니다.
# 상대 경로는 저장소 맨 위 폴더 기준입니다.

round: r001            # 이번 회차 이름(r + 숫자 3자리). 결과는 out/training/datasets/r001, models/r001
prev_round: null       # 직전 회차. null 이면 번호 하나 앞(r001 이면 r000 = 처음 받은 yolov8s.pt)

paths:
  drives_root: out/drives        # 파이에서 rsync 로 옮긴 주행 녹화(out/drives/<주행>/<세그먼트>/)
  triggers_root: out/triggers    # 파이에서 옮긴 트리거 클립(json 과 영상 또는 이미지)
  work_root: out/training        # datasets/, test_set/ 이 생기는 곳(git 에 안 올라감)
  models_root: models            # best.pt, onnx, hef, dxnn 이 쌓이는 곳(git 에 안 올라감)
  coco_root: null                # COCO YOLO 형식 폴더(images/train2017, labels/train2017). null 이면 COCO 섞기 생략

# 이번 회차에 새로 쓸 주행 폴더 이름. 글롭 가능("d202612*"). 이전 회차가 쓴 주행은 빼고 적습니다.
drives: ["*"]

# 녹화 형식. 기본값은 파이 주행 녹화(realityview/drive_rec.py)와 트리거 클립(realityview/triggers.py) 형식입니다.
#   out/drives/<주행 시작 시각>/seg_0000/<카메라>.mjpeg + <카메라>.csv(frame, index, sensor_ns, wall_time, offset, size, gap)
#   out/triggers/<실행 이름>/<시각>_f<프레임>_<종류>/trigger.json(events 목록) + <카메라>.mjpeg, .csv
# mp4, avi 같은 영상 파일과 record_frames.py 의 <카메라>_00000.png 도 읽습니다.
recording:
  video_exts: [".mjpeg", ".mjpg", ".mp4", ".mkv", ".avi", ".h264"]
  timestamp_csv: ["{camera}.csv", "{camera}_ts.csv", "{camera}_timestamps.csv", "timestamps.csv"]
  frame_columns: [frame, frame_idx, idx, index]       # 파일 안 프레임 번호 열(처음 맞는 것)
  time_columns: [sensor_ns, t_sensor_ns, ts_ns, t_mono, t]   # 이름이 ns 로 끝나면 나노초, 아니면 초
  camera_column: camera
  fps_fallback: 30.0             # 영상과 csv 어디에도 fps 정보가 없을 때

triggers:
  enabled: true
  json_glob: "**/*.json"
  events_key: events             # 종류와 점수가 위에 없으면 이 목록에서 읽음
  kind_keys: [kind, type, trigger]
  score_keys: [score]
  media_keys: [video, file, frames_dir, path, dir]   # 없으면 json 과 같은 폴더의 영상을 클립으로 봄
  every_sec: 0.5                 # 클립은 짧으므로 더 촘촘히 뽑는다

select:
  every_sec: 1.0                 # 영상에서 몇 초마다 한 장을 후보로 볼지
  blur_min: 60.0                 # 라플라시안 분산이 이보다 작으면 흐린 프레임으로 버림(폭 640 으로 줄여 잰 값)
  blur_min_night: 15.0           # 평균 밝기가 night_brightness 아래인 프레임에 쓰는 흐림 문턱(실제 밤 영상으로 조정 필요)
  blur_width: 640
  dup_diff: 2.5                  # 32x18 축소 회색 영상의 평균 밝기 차가 이보다 작으면 거의 같은 프레임
  dup_window: 20                 # 같은 카메라에서 최근에 고른 몇 장과 비교할지
  night_brightness: 60.0         # 평균 밝기(0~255)가 이보다 낮으면 night, 아니면 day
  scene_tags_csv: null           # 수동 태그 csv(drive, segment, start_s, end_s, scene). 밝기 추정보다 우선
  n_frames: 2000                 # 이번 회차에 고를 프레임 수(트리거 포함)
  trigger_max_ratio: 0.3         # 트리거 프레임이 차지할 수 있는 최대 비율
  seed: 0

# 고정 시험 세트. 처음 한 번 정하면 lock.json 으로 잠기고 이후 회차 선별에서 빠집니다.
test_set:
  n_frames: 200
  exclude: segment               # segment: 시험 프레임이 나온 세그먼트 전체를 학습에서 뺌(권장), window: 앞뒤 window_sec 만 뺌
  segment_ratio: 0.15            # exclude=segment 일 때 시험용으로 떼어 둘 세그먼트 비율
  window_sec: 10.0

autolabel:
  primary: grounding_dino        # 학습 라벨이 되는 라벨러
  secondary: yolo                # 비교용 라벨러(지금 쓰는 YOLOv8s). null 이면 비교 생략
  road: points                   # 도로 마스크: points(아래쪽 점 프롬프트), text(Grounding DINO "road ." 박스), none
  keep_score: 0.35               # 이 점수 이상인 박스만 라벨로 남김
  ambiguous: [0.3, 0.5]          # 이 구간 점수의 박스가 있으면 의심 프레임
  match_iou: 0.5                 # 두 라벨러 박스를 같은 물체로 볼 IoU
  disagree_min: 1                # 짝 없는 박스가 이 개수 이상이면 의심 프레임
  grounding_dino:
    config: models/gdino/GroundingDINO_SwinT_OGC.py
    weights: models/gdino/groundingdino_swint_ogc.pth
    caption: "car . person . truck . bus . bicycle . motorcycle ."
    box_threshold: 0.3
    text_threshold: 0.25
  sam2:
    config: configs/sam2.1/sam2.1_hiera_l.yaml
    checkpoint: models/sam2/sam2.1_hiera_large.pt
    road_points: [[0.5, 0.93], [0.3, 0.97], [0.7, 0.97]]   # 영상 폭, 높이 비율. 보닛이 보이면 위로 올립니다
  yolo:
    weights: yolov8s.pt
    conf: 0.25

review:
  format: cvat                   # cvat(CVAT for images 1.1, 박스와 도로 다각형) 또는 yolo(YOLO 1.1, 박스만)
  random_ratio: 0.1              # 의심 프레임이 아닌 프레임 가운데 무작위로 검수할 비율

# 검출 학습. 기본값 근거는 training/train_det.py 의 주석에 있습니다.
train_det:
  base_weights: yolov8s.pt       # 첫 회차 시작점. 둘째 회차부터는 models/<직전 회차>/best.pt
  imgsz: 640
  batch: 16
  epochs: 50
  workers: 8
  val_ratio: 0.1
  prev_ratio: 0.5                # 이번 회차 학습 프레임 수 대비 이전 회차 프레임을 섞는 비율
  coco_ratio: 0.5                # 이번 회차 학습 프레임 수 대비 COCO 이미지를 섞는 비율

train_seg:
  label_mode: road_first         # road_first: 0 도로, 1 그 밖(파이 road_classes=(0,) 그대로), cityscapes_keep: 0 도로, 나머지 무시
  mmseg_root: ~/mmsegmentation

evaluate:
  map_tolerance: 0.01            # 예전 장면 mAP 가 직전 회차보다 이만큼 넘게 떨어지면 경고
  recall_tolerance: 0.03
  recall_conf: 0.4               # 재현율을 잴 점수 문턱(파이 기본 score_thr 와 같게)

export:
  model_stem: yolov8s            # 결과 이름: models/yolov8s_r001.onnx, .hef, .dxnn
  calib_n: 1024                  # Hailo 보정 이미지 수
  dx_calib_n: 100                # DX-COM 보정 이미지 수
  dx_ppu: false                  # true 면 DX-COM json 에 PPU 항목을 넣음(형식 확인 필요)
  pi_target: "<PI_USER>@<PI_HOST>:<PI_REPO>/models/"
