# 1단계 실기 검증용: 지금 파이에 꽂혀 있는 카메라 2대 그대로 쓰는 설정 (2026-11-24 기준)
#   0번 ov5647 (Camera Module 1 계열로 추정) -> 전방
#   1번 imx708 (일반 Camera Module 3로 추정, rpicam 이름이 imx708_wide가 아님) -> 후방
# 계획서의 Camera Module 3 Wide 2대 구성은 configs/two_cam.yaml을 쓴다.
# 좌표계: 차량 X 전방, Y 좌측, Z 위 (m). 원점은 뒷바퀴 축 중앙 바닥.
bev:
  x_min: -15.0
  x_max: 25.0
  y_min: -12.0
  y_max: 12.0
  res: 0.05

cameras:
  - name: front
    # ov5647 센서 비율 4:3을 그대로 써서 ISP가 위아래를 잘라 내지 않게 한다(잘라 내면 화각 계산이 달라짐)
    width: 768
    height: 576
    intrinsics:
      # 보정 전 근사값. scripts/calib_intrinsics.py 결과로 교체할 것.
      # 근거: ov5647 화소 1.4um, 렌즈 초점거리 3.60mm (Camera Module 1 사양)
      #   전체 해상도 기준 fx = 3.60mm / 1.4um = 2571.4 px
      #   센서 모드 1296x972는 전체 2592x1944를 2x2로 묶은 것(잘라 냄 없음), 이를 768 폭으로 줄이면
      #   fx = 2571.4 x 768 / 2592 = 761.9 px, 수평 화각 = 2 x atan(384 / 761.9) = 53.5도
      # 렌즈 왜곡은 모르므로 0으로 둔다. 광각 렌즈를 단 ov5647 보드라면 이 값은 크게 틀린다(확인 필요).
      # 2026-11-24 영상에서 천장 경계선이 휘는 통 왜곡이 보였고, 같은 의자가 1번(imx708)보다 작게 찍혀
      # 실제 화각이 이 값(53.5도)보다 넓을 가능성이 크다. 렌즈 사양 확인과 보정 전까지 전방 거리 값은 믿지 않는다.
      model: pinhole
      fx: 761.9
      fy: 761.9
      cx: 384.0
      cy: 288.0
      dist: [0.0, 0.0, 0.0, 0.0]
    extrinsics:
      # 실측 필요: configs/two_cam.yaml 값을 그대로 옮긴 것. scripts/calib_extrinsics.py로 교체할 것.
      position: [1.9, 0.0, 1.30]
      yaw: 0.0
      pitch: 12.0             # 아래로 숙인 각도
      roll: 0.0
    source:
      type: picamera2
      index: 0
      fps: 30                 # 획득 대기가 10 FPS 목표를 가리지 않게 넉넉히(모드 최대 46 fps)
      sensor_size: [1296, 972]  # 전체 화각 2x2 비닝 모드. 640x480, 1920x1080은 가장자리를 잘라 낸 모드라 쓰지 않음
      # 추가 회전 없음. Picamera2가 Rotation 0을 보고하고, 2026-11-24 영상(01_det_check_cam0)에서 위아래가 바로 섬.
      # 좌우 거울상 여부는 영상 속 글자가 읽히지 않아 확인 필요.
      rotation: 0

  - name: rear
    width: 768
    height: 432
    intrinsics:
      # 보정 전 근사값. scripts/calib_intrinsics.py 결과로 교체할 것.
      # 근거: imx708 화소 1.4um, 렌즈 초점거리 4.74mm (Camera Module 3 일반형 사양)
      #   전체 해상도 기준 fx = 4.74mm / 1.4um = 3385.7 px
      #   센서 모드 2304x1296은 전체 4608x2592를 2x2로 묶은 것(잘라 냄 없음), 이를 768 폭으로 줄이면
      #   fx = 3385.7 x 768 / 4608 = 564.3 px, 수평 화각 = 2 x atan(384 / 564.3) = 68.5도
      #   (Raspberry Pi 문서의 수평 66도와 약 2.5도 차이. 실제 값은 보정으로 정한다.)
      # 자동 초점 렌즈라 초점 위치에 따라 fx가 조금 바뀐다. 보정 때와 주행 때 초점을 같게 둘 것.
      model: pinhole
      fx: 564.3
      fy: 564.3
      cx: 384.0
      cy: 216.0
      dist: [0.0, 0.0, 0.0, 0.0]
    extrinsics:
      # 실측 필요: configs/two_cam.yaml 값을 그대로 옮긴 것. scripts/calib_extrinsics.py로 교체할 것.
      position: [-0.9, 0.0, 1.10]
      yaw: 180.0
      pitch: 15.0
      roll: 0.0
    source:
      type: picamera2
      index: 1
      fps: 30
      sensor_size: [2304, 1296]  # 전체 화각 2x2 비닝 모드. 1536x864는 가운데 3072x1728만 쓰는 모드라 화각이 좁다
      # 추가 회전 없음. Picamera2는 이 센서의 장착 Rotation을 180으로 보고하지만 libcamera가 이미 보정해서
      # 2026-11-24 영상(01_det_check_cam1)은 위아래가 바로 서고 명찰 글자도 바른 방향(거울상 아님)이었다.
      # 카메라를 다시 달아 영상이 뒤집혀 보이면 180으로 바꾼다(소스가 좌우, 상하를 함께 뒤집음).
      rotation: 0

npu:
  det_hef: models/yolov8s_h8.hef          # 파이에서 cp /usr/share/hailo-models/yolov8s_h8.hef models/ 로 복사
  seg_hef: null
  road_classes: [0]
  score_thr: 0.4
  seg_every: 3
