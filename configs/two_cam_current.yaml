# 1단계 실기 검증용: 지금 파이에 꽂혀 있는 카메라 2대 그대로 쓰는 설정
#   0번 ov5647 130도 광각 렌즈(IR 컷, 야간 가능) -> 전방, 어안 모델로 본다
#   1번 imx708 (일반 Camera Module 3, rpicam 이름이 imx708_wide가 아님) -> 후방, 핀홀 모델
# 계획서의 Camera Module 3 Wide 2대 구성은 configs/two_cam.yaml을 쓴다.
# 좌표계: 차량 X 전방, Y 좌측, Z 위 (m). 원점은 뒷바퀴 축 중앙 바닥(docs/04_tesla_camera_layout.md와 같음).
#
# 카메라 장착 위치는 "테슬라 모델 Y에서 같은 역할의 카메라 자리에 단다"는 가정을 따른다.
#   전방 -> 테슬라 전방 광각 자리(앞유리 상단), 후방 -> 테슬라 후방 카메라 자리(뒷번호판 위)
# 04 문서의 좌표는 매뉴얼의 문장 설명으로 정한 추정치이고, 각도 일부는 3D 도면
# (viz/tesla_camera_layout_3d.html)의 추정값이다. 실제 차에 단 뒤 scripts/calib_extrinsics.py로 바꾼다.
#
# BEV 범위 확인(이 위치, 이 화각 기준. 수치는 scripts/check_mount.py로 계산, 결과 out/measure/07_tesla_mount.md):
#   전방(높이 1.45m, 3도 숙임)은 카메라 앞 1.6m(x 3.4)부터 바닥이 보인다. 실제 차에서는 보닛이 가려
#   앞범퍼(x 3.78) 앞부터 쓸 수 있다(확인 필요). 전방 셀은 x 2.8~25, 좌우 12m 끝까지 덮는다.
#   후방(높이 1.00m, 20도 숙임)은 카메라 뒤 1.16m(x -2.1)부터 보이고, 후방 셀은 x -2.1~-15, 좌우 약 9.2m.
#   차 옆(x -2.1~2.8)은 두 카메라 모두 못 보는 사각지대다.
#   셀 5cm는 정면 5m 안팎에서 영상 한 화소(약 4.4cm)와 맞고, 10m에서는 한 화소가 17cm, 25m에서는 1m라
#   먼 곳은 늘어진 그림이 된다. 탑뷰 표시용이므로 범위와 셀 크기는 그대로 둔다.
bev:
  x_min: -15.0
  x_max: 25.0
  y_min: -12.0
  y_max: 12.0
  res: 0.05

cameras:
  - name: front
    # ov5647 센서 비율 4:3을 그대로 써서 ISP가 위아래를 잘라 내지 않게 한다(잘라 내면 화각 계산이 달라짐)
    width: 768
    height: 576
    intrinsics:
      # 보정 전 근사값. scripts/calib_intrinsics.py --model fisheye 결과로 바꿀 것.
      # 렌즈는 판매처 사양 "130도 광각"(사용자 확인). 영상에서도 통 왜곡이 보여 핀홀이 아니라 어안으로 본다.
      # 근거: 130도가 수평인지 대각인지 확인 필요라 대각 130도로 보고 등거리 어안(r = f x theta, 왜곡 0)으로
      #   계산했다: 대각 반지름 480px / (65도 = 1.1345rad) = 423.1px. configs/two_cam_model.yaml과 같은 값.
      #   예전 값(핀홀 fx 761.9, 수평 53.5도)은 Camera Module 1 기본 렌즈 사양이라 이 렌즈와 맞지 않는다.
      # 위치를 어떻게 가정하든 렌즈 왜곡 보정(내부 보정)은 따로 꼭 해야 거리 값을 믿을 수 있다.
      model: fisheye
      fx: 423.1
      fy: 423.1
      cx: 384.0
      cy: 288.0
      dist: [0.0, 0.0, 0.0, 0.0]   # OpenCV fisheye k1~k4. 보정 전에는 0(등거리)
      max_fov_deg: 140.0           # 이 각도(대각 전체)보다 바깥은 영상에 없는 것으로 본다. 130도에 여유 10도
    extrinsics:
      # 테슬라 모델 Y 전방 광각 카메라 자리(앞유리 상단, 04 문서). 좌표는 04 문서의 추정치. 실측 필요.
      position: [1.80, -0.06, 1.45]
      yaw: 0.0                # 정면(04 문서)
      # 04 문서는 "정면"이라고만 적었다. 3D 도면(viz/tesla_camera_layout_3d.html)의 추정값 3도를 쓴다.
      # 거의 수평이라 영상 위쪽 절반은 하늘이고 바닥은 아래쪽 절반에만 찍힌다. 실측 필요.
      pitch: 3.0              # 아래로 숙인 각도
      roll: 0.0               # 문서에 없음. 수평으로 달았다고 가정. 실측 필요
    source:
      type: picamera2
      index: 0
      fps: 30                 # 획득 대기가 10 FPS 목표를 가리지 않게 넉넉히(모드 최대 46 fps)
      sensor_size: [1296, 972]  # 전체 화각 2x2 비닝 모드. 640x480, 1920x1080은 가장자리를 잘라 낸 모드라 쓰지 않음
      # 추가 회전 없음. Picamera2가 Rotation 0을 보고하고, 2026-11-24 영상(01_det_check_cam0)에서 위아래가 바로 섬.
      # 좌우 거울상 여부는 영상 속 글자가 읽히지 않아 확인 필요.
      rotation: 0

  - name: rear
    width: 768
    height: 432
    intrinsics:
      # 보정 전 근사값. scripts/calib_intrinsics.py 결과로 교체할 것.
      # 근거: imx708 화소 1.4um, 렌즈 초점거리 4.74mm (Camera Module 3 일반형 사양)
      #   전체 해상도 기준 fx = 4.74mm / 1.4um = 3385.7 px
      #   센서 모드 2304x1296은 전체 4608x2592를 2x2로 묶은 것(잘라 냄 없음), 이를 768 폭으로 줄이면
      #   fx = 3385.7 x 768 / 4608 = 564.3 px, 수평 화각 = 2 x atan(384 / 564.3) = 68.5도
      #   (Raspberry Pi 문서의 수평 66도와 약 2.5도 차이. 실제 값은 보정으로 정한다.)
      # 자동 초점 렌즈라 초점 위치에 따라 fx가 조금 바뀐다. 보정 때와 주행 때 초점을 같게 둘 것.
      model: pinhole
      fx: 564.3
      fy: 564.3
      cx: 384.0
      cy: 216.0
      dist: [0.0, 0.0, 0.0, 0.0]
    extrinsics:
      # 테슬라 모델 Y 후방 카메라 자리(뒷번호판 위, 04 문서). 좌표는 04 문서의 추정치. 실측 필요.
      # 테슬라 후방 카메라는 130도 어안(04 문서의 가정값)이지만 여기 imx708은 수평 약 68.5도라
      # 같은 자리에 달아도 보이는 바닥 폭이 좁다.
      position: [-0.95, 0.0, 1.00]
      yaw: 180.0              # 뒤쪽
      pitch: 20.0             # 아래로 20도. 04 문서의 값이지만 문서도 추정이라고 적었다. 실측 필요
      roll: 0.0               # 문서에 없음. 수평으로 달았다고 가정. 실측 필요
    source:
      type: picamera2
      index: 1
      fps: 30
      sensor_size: [2304, 1296]  # 전체 화각 2x2 비닝 모드. 1536x864는 가운데 3072x1728만 쓰는 모드라 화각이 좁다
      # 추가 회전 없음. Picamera2는 이 센서의 장착 Rotation을 180으로 보고하지만 libcamera가 이미 보정해서
      # 2026-11-24 영상(01_det_check_cam1)은 위아래가 바로 서고 명찰 글자도 바른 방향(거울상 아님)이었다.
      # 카메라를 다시 달아 영상이 뒤집혀 보이면 180으로 바꾼다(소스가 좌우, 상하를 함께 뒤집음).
      rotation: 0

npu:
  det_hef: models/yolov8s_h8.hef          # 파이에서 cp /usr/share/hailo-models/yolov8s_h8.hef models/ 로 복사
  seg_hef: null
  road_classes: [0]
  score_thr: 0.4
  seg_every: 3
  # ---- DX-M1 (--backend dxm1, --seg-npu dxm1) ----
  # .dxnn은 파이 저장소의 models/dxnn/ 에 둔다. 받은 주소와 sha256은 out/measure/05_dxnn_sources.md.
  # 둘 다 DEEPX 모델 저장소 2_4_0(.dxnn 형식 v8, DX-COM 2.4.0)이라 파이의 DX-RT 3.4.2에서 돈다.
  # 검출은 장치 후처리(PPU) 모델: 원시 출력 모델(yolov8-s_640x640.dxnn)보다 카메라 2대 기준 약 3.6배 빠르다
  # (2026-11-24 파이 실측 41.1 대 11.4 프레임/초). 원시 출력 모델로 바꿔도 같은 코드로 돈다.
  dx_det_model: models/dxnn/yolov8-s_640x640_ppu.dxnn
  dx_det_format: yolov8                   # yolov8 = [cx,cy,w,h,클래스...], yolov5 = [cx,cy,w,h,물체,클래스...]
  # 도로 세그: BiSeNetV2 Cityscapes(입력 1024x2048 RGB, 출력 (1,1024,2048) uint16 클래스 번호, 0 = road)
  dx_seg_model: models/dxnn/bisenetv2_1024x2048.dxnn
  dx_input_rgb: true                      # DEEPX dx_app 예제도 RGB로 넣는다(LetterboxPreprocessor, SimpleResizePreprocessor)
  dx_seg_channels_first: true             # 로짓 출력 모델일 때만 쓴다. BiSeNetV2는 클래스 번호라 상관없음
  dx_iou_thr: 0.45                        # CPU NMS의 IoU 기준

# ---- 회차 모델(realityview/model_rounds.py, docs/drive_recording.md) ----
# 추가 학습 회차마다 models/<det_name>_r<세 자리>.hef 와 .dxnn 을 만들어 두고 여기서 회차를 고른다.
# 0회차는 이름 규칙 이전의 공개 사전학습 모델이라 경로를 직접 적는다(npu.det_hef, npu.dx_det_model과 같은 파일).
# 이 항목을 지우면 예전처럼 npu.det_hef, npu.dx_det_model 을 쓴다.
models:
  dir: models
  det_name: yolov8s
  det_model_round: 0        # 화면과 추적에 쓰는 회차(--backend hailo면 hef, dxm1이면 dxnn)
  shadow_model_round: 0     # --shadow 때 반대쪽 NPU에서 같이 돌려 비교할 회차
  rounds:
    0:
      hef: models/yolov8s_h8.hef
      dxnn: models/dxnn/yolov8-s_640x640_ppu.dxnn
