# 카메라 4대 구성 시험용: 지금 파이에 꽂힌 CSI 2대(전방 ov5647, 후방 Camera Module 3) + 가짜 측면 카메라 2대.
# 측면 카메라는 scripts/make_sim4.py가 만든 합성 영상(out/sim4/cam2.mp4, cam3.mp4)을 USB 카메라처럼
# 정해진 속도로 읽고 받은 시각(time.monotonic_ns)을 붙인다(source.type: video). 그래서 CSI 센서 시각과 같은 시계다.
# 진짜 USB 카메라를 달면 측면 source를 아래 주석처럼 type: usb 로 바꾼다.
#
# 전방, 후방 블록은 configs/two_cam_current.yaml과 같은 값(보정 전 근사값, 테슬라 모델 Y 자리 가정)이고,
# 좌우 블록은 configs/four_cam.yaml의 좌우 리피터 자리 값이다. 모두 실측 필요.
bev:
  x_min: -15.0
  x_max: 25.0
  y_min: -12.0
  y_max: 12.0
  res: 0.05

cameras:
  - name: front
    width: 768
    height: 576
    intrinsics: {model: fisheye, fx: 423.1, fy: 423.1, cx: 384.0, cy: 288.0, dist: [0.0, 0.0, 0.0, 0.0], max_fov_deg: 140.0}
    extrinsics: {position: [1.80, -0.06, 1.45], yaw: 0.0, pitch: 3.0, roll: 0.0}
    source: {type: picamera2, index: 0, fps: 30, sensor_size: [1296, 972], rotation: 0}

  - name: rear
    width: 768
    height: 432
    intrinsics: {model: pinhole, fx: 564.3, fy: 564.3, cx: 384.0, cy: 216.0, dist: [0.0, 0.0, 0.0, 0.0]}
    extrinsics: {position: [-0.95, 0.0, 1.00], yaw: 180.0, pitch: 20.0, roll: 0.0}
    source: {type: picamera2, index: 1, fps: 30, sensor_size: [2304, 1296], rotation: 0}

  - name: left
    width: 768
    height: 432
    intrinsics: {model: pinhole, fx: 311.0, fy: 311.0, cx: 384.0, cy: 216.0, dist: [0.0, 0.0, 0.0, 0.0]}
    extrinsics: {position: [2.25, 0.97, 0.92], yaw: 135.0, pitch: 5.0, roll: 0.0}
    # 가짜 USB 카메라: 파일을 30 fps 속도로 읽고 끝나면 처음부터
    source: {type: video, uri: out/sim4/cam2.mp4, fps: 30}
    # 진짜 USB 카메라 예(파이의 /dev/video0~15는 CSI 장치라 번호 대신 by-id 경로를 쓴다):
    # source: {type: usb, device: /dev/v4l/by-id/usb-XXXX-video-index0, fps: 30, fourcc: MJPG, timestamp_offset_ms: 0}

  - name: right
    width: 768
    height: 432
    intrinsics: {model: pinhole, fx: 311.0, fy: 311.0, cx: 384.0, cy: 216.0, dist: [0.0, 0.0, 0.0, 0.0]}
    extrinsics: {position: [2.25, -0.97, 0.92], yaw: -135.0, pitch: 5.0, roll: 0.0}
    source: {type: video, uri: out/sim4/cam3.mp4, fps: 30}

npu:
  det_hef: models/yolov8s_h8.hef
  seg_hef: null
  road_classes: [0]
  score_thr: 0.4
  seg_every: 3
