# 책상이나 바닥 위 모형으로 보정과 시험을 할 때 쓰는 설정 (카메라는 지금 달린 2대 그대로)
#   0번 ov5647 130도 광각(IR 컷, 야간 가능) 렌즈 -> 전방, 어안 모델(OpenCV fisheye)로 본다
#   1번 imx708 일반 Camera Module 3 -> 후방, 핀홀 모델
# 좌표계: 모형 X 전방, Y 좌측, Z 위 (m). 원점은 모형 차체 가운데 바닥(실차의 뒷축 중앙에 해당).
# "실측 필요"라고 적힌 값은 docs/phase1_model_rig_calibration.md 절차로 재서 바꾼다.

# 장면 축척: 실차 대비 모형 비율. 카메라 높이로 정한다(모형 0.20m / 실차 1.30m = 약 0.15).
# 물체 기본 크기(차 4.5m 등), 카메라 간 병합 반경(1.5m), 추적 거리(2.5m), 탑뷰 자차와 거리 고리를
# 이 비율로 줄인다. 카메라 높이를 바꾸면 이 값도 같이 바꾼다.
scene:
  scale: 0.15

bev:
  # 모형 앞뒤 2m, 좌우 1.2m, 셀 1cm (400 x 240 셀). 실차 설정(앞 25m, 뒤 15m, 5cm)보다 훨씬 작다.
  x_min: -2.0
  x_max: 2.0
  y_min: -1.2
  y_max: 1.2
  res: 0.01

cameras:
  - name: front
    width: 768
    height: 576
    intrinsics:
      # 보정 전 근사값. scripts/calib_intrinsics.py --model fisheye 결과로 바꿀 것.
      # 근거: 판매처 사양 "130도 광각". 수평인지 대각인지 확인 필요라 대각 130도로 보고 등거리 어안
      #   (r = f x theta, 왜곡 0)으로 계산했다: 대각 반지름 480px / (65도 = 1.1345rad) = 423.1px.
      #   수평 130도라면 f = 384 / 1.1345 = 338.5px로 바뀐다(realityview.camera_model.fisheye_f_from_fov).
      model: fisheye
      fx: 423.1
      fy: 423.1
      cx: 384.0
      cy: 288.0
      dist: [0.0, 0.0, 0.0, 0.0]   # OpenCV fisheye k1~k4. 보정 전에는 0(등거리)
      # 이 각도(대각 전체)보다 바깥 방향은 영상에 없는 것으로 본다. 130도에 여유 10도.
      # 보정 뒤 왜곡 계수가 생기면 투영식이 단조인 범위로 한 번 더 자른다(camera_model.fisheye_theta_max).
      max_fov_deg: 140.0
    extrinsics:
      # 실측 필요: 모형에 단 위치를 줄자로 잰 뒤 scripts/calib_extrinsics.py로 바꿀 것.
      position: [0.15, 0.0, 0.20]   # 모형 가운데에서 앞으로 15cm, 높이 20cm (예시)
      yaw: 0.0
      pitch: 25.0                   # 아래로 숙인 각도. 모형은 가까운 바닥을 보려고 실차보다 많이 숙인다
      roll: 0.0
    source:
      type: picamera2
      index: 0
      fps: 30
      sensor_size: [1296, 972]      # 전체 화각 2x2 비닝 모드(two_cam_current.yaml과 같음). 보정도 이 모드로 찍는다
      rotation: 0

  - name: rear
    width: 768
    height: 432
    intrinsics:
      # 보정 전 근사값(two_cam_current.yaml과 같음, 수평 약 68.5도). scripts/calib_intrinsics.py 결과로 바꿀 것.
      # 자동 초점 렌즈라 모형 거리(수십 cm)에서는 초점 위치에 따라 fx가 바뀐다. 보정과 시험 때 초점을 같게 둔다.
      model: pinhole
      fx: 564.3
      fy: 564.3
      cx: 384.0
      cy: 216.0
      dist: [0.0, 0.0, 0.0, 0.0]
    extrinsics:
      # 실측 필요
      position: [-0.15, 0.0, 0.20]
      yaw: 180.0
      pitch: 25.0
      roll: 0.0
    source:
      type: picamera2
      index: 1
      fps: 30
      sensor_size: [2304, 1296]
      rotation: 0

npu:
  det_hef: models/yolov8s_h8.hef
  seg_hef: null
  road_classes: [0]                 # Cityscapes road (DEEPX dx_app labels.py 기준)
  score_thr: 0.4
  seg_every: 3
  # DX-M1 모델은 two_cam_current.yaml과 같다. 받은 주소와 sha256은 out/measure/05_dxnn_sources.md
  dx_det_model: models/dxnn/yolov8-s_640x640_ppu.dxnn
  dx_det_format: yolov8
  dx_seg_model: models/dxnn/bisenetv2_1024x2048.dxnn
  dx_input_rgb: true
  dx_seg_channels_first: true
  dx_iou_thr: 0.45
