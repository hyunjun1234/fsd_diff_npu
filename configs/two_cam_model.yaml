# 책상이나 바닥 위 모형으로 보정과 시험을 할 때 쓰는 설정 (카메라는 지금 달린 2대 그대로)
#   0번 ov5647 130도 광각(IR 컷, 야간 가능) 렌즈 -> 전방, 어안 모델(OpenCV fisheye)로 본다
#   1번 imx708 일반 Camera Module 3 -> 후방, 핀홀 모델
# 카메라 자리는 테슬라 모델 Y에서 같은 역할의 카메라 자리(docs/04_tesla_camera_layout.md)를
# scene.scale로 줄인 곳이다. 실차 설정 configs/two_cam_current.yaml과 위치(실차 m)와 각도가 같다.
# 좌표계: 모형 X 전방, Y 좌측, Z 위 (m). 원점은 모형 뒷바퀴 축 가운데 바닥(실차와 같은 기준).
#   모형 차체는 x -0.101(뒤범퍼) ~ 0.378(앞범퍼)이라 차체 가운데는 원점보다 약 14cm 앞이다(축척 1/10 기준).
# "실측 필요"라고 적힌 값은 docs/phase1_model_rig_calibration.md 절차로 재서 바꾼다.

# 장면 축척: 실차 대비 모형 비율. 모형 크기에 맞춰 사람이 정하는 값이다.
# 이 값 하나로 아래 실차 단위 값(position_car, bev_car)과 물체 기본 크기(차 4.5m 등),
# 카메라 간 병합 반경(1.5m), 추적 거리(2.5m), 탑뷰 자차와 거리 고리를 함께 줄인다. 각도와 화각은 그대로다.
# 기본값 1/10의 근거: 모델 Y 길이 4.79m가 약 48cm가 되어 1/10 RC카 차체와 비슷하고 책상이나 바닥에
#   올리기 좋다. 카메라 높이가 전방 14.5cm, 후방 10cm라 카메라 보드(약 25mm)를 달 자리도 나온다.
scene:
  scale: 0.1

# BEV 범위와 셀 크기(실차 m). 로더가 scene.scale을 곱해 모형 m로 쓴다(realityview/config.py).
#   1/10이면 앞 2.5m, 뒤 1.5m, 좌우 1.2m, 셀 1cm (400 x 240 셀).
# 범위는 실차 설정과 같다. 셀은 실차 설정(5cm)보다 2배 거친 실차 10cm로 두어 셀 수를 예전 모형 설정과
# 같게 유지했다(파이 처리 시간 때문). 모형 m로 직접 적고 싶으면 bev_car 대신 bev를 쓴다(둘을 함께 쓰면 오류).
bev_car:
  x_min: -15.0
  x_max: 25.0
  y_min: -12.0
  y_max: 12.0
  res: 0.10

cameras:
  - name: front
    width: 768
    height: 576
    intrinsics:
      # 보정 전 근사값. scripts/calib_intrinsics.py --model fisheye 결과로 바꿀 것.
      # 근거: 판매처 사양 "130도 광각". 수평인지 대각인지 확인 필요라 대각 130도로 보고 등거리 어안
      #   (r = f x theta, 왜곡 0)으로 계산했다: 대각 반지름 480px / (65도 = 1.1345rad) = 423.1px.
      #   수평 130도라면 f = 384 / 1.1345 = 338.5px로 바뀐다(realityview.camera_model.fisheye_f_from_fov).
      model: fisheye
      fx: 423.1
      fy: 423.1
      cx: 384.0
      cy: 288.0
      dist: [0.0, 0.0, 0.0, 0.0]   # OpenCV fisheye k1~k4. 보정 전에는 0(등거리)
      # 이 각도(대각 전체)보다 바깥 방향은 영상에 없는 것으로 본다. 130도에 여유 10도.
      # 보정 뒤 왜곡 계수가 생기면 투영식이 단조인 범위로 한 번 더 자른다(camera_model.fisheye_theta_max).
      max_fov_deg: 140.0
    extrinsics:
      # 테슬라 전방 광각 자리(앞유리 상단)의 실차 좌표(04 문서의 추정치). 로더가 scene.scale을 곱한다.
      #   1/10이면 원점에서 앞으로 18cm, 오른쪽으로 0.6cm, 높이 14.5cm.
      # 외부 보정 뒤에는 scripts/calib_extrinsics.py가 내놓는 position(모형 m)을 이 줄 대신 넣는다.
      # position이 있으면 position_car는 쓰지 않는다.
      position_car: [1.80, -0.06, 1.45]
      yaw: 0.0                      # 정면(04 문서)
      pitch: 3.0                    # 아래로 3도. 3D 도면(viz/tesla_camera_layout_3d.html)의 추정값. 실측 필요
      roll: 0.0                     # 문서에 없음. 수평으로 달았다고 가정. 실측 필요
    source:
      type: picamera2
      index: 0
      fps: 30
      sensor_size: [1296, 972]      # 전체 화각 2x2 비닝 모드(two_cam_current.yaml과 같음). 보정도 이 모드로 찍는다
      rotation: 0

  - name: rear
    width: 768
    height: 432
    intrinsics:
      # 보정 전 근사값(two_cam_current.yaml과 같음, 수평 약 68.5도). scripts/calib_intrinsics.py 결과로 바꿀 것.
      # 자동 초점 렌즈라 모형 거리(수십 cm)에서는 초점 위치에 따라 fx가 바뀐다. 보정과 시험 때 초점을 같게 둔다.
      model: pinhole
      fx: 564.3
      fy: 564.3
      cx: 384.0
      cy: 216.0
      dist: [0.0, 0.0, 0.0, 0.0]
    extrinsics:
      # 테슬라 후방 카메라 자리(뒷번호판 위)의 실차 좌표(04 문서의 추정치). 로더가 scene.scale을 곱한다.
      #   1/10이면 원점에서 뒤로 9.5cm, 높이 10cm.
      position_car: [-0.95, 0.0, 1.00]
      yaw: 180.0                    # 뒤쪽
      pitch: 20.0                   # 아래로 20도. 04 문서의 값(문서도 추정이라고 적음). 실측 필요
      roll: 0.0                     # 문서에 없음. 수평으로 달았다고 가정. 실측 필요
    source:
      type: picamera2
      index: 1
      fps: 30
      sensor_size: [2304, 1296]
      rotation: 0

npu:
  det_hef: models/yolov8s_h8.hef
  seg_hef: null
  road_classes: [0]                 # Cityscapes road (DEEPX dx_app labels.py 기준)
  score_thr: 0.4
  seg_every: 3
  # DX-M1 모델은 two_cam_current.yaml과 같다. 받은 주소와 sha256은 out/measure/05_dxnn_sources.md
  dx_det_model: models/dxnn/yolov8-s_640x640_ppu.dxnn
  dx_det_format: yolov8
  dx_seg_model: models/dxnn/bisenetv2_1024x2048.dxnn
  dx_input_rgb: true
  dx_seg_channels_first: true
  dx_iou_thr: 0.45
